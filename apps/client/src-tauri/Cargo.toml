[package]
name = "devgarden-client"
version = "0.1.0"
description = "DevGarden desktop client"
authors = ["haesookimDev"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devgarden_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v0.3 P2: OS keychain access (mac keychain / windows credential mgr / libsecret).
# `apple-native` / `windows-native` keep the macOS / Windows backends without
# pulling extra crates; `sync-secret-service` is the libsecret backend for Linux
# (D-Bus + gnome-keyring/kwallet). With no backend available the calls return
# NoStorageAccess which the JS layer maps to the file fallback.
keyring = { version = "3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "vendored",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
